openapi: 3.1.0
info:
  title: FileShare User API
  version: 1.0.0
  description: API для управления пользовательскими файлами и передачами.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Account
  - name: Uploads
  - name: Transfers
  - name: Settings
paths:
  /me:
    get:
      tags: [Account]
      operationId: getMe
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /groups:
    post:
      tags: [Uploads]
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreateRequest" }
      responses:
        "201": { $ref: "#/components/responses/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /uploads:
    post:
      tags: [Uploads]
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                expiry: { $ref: "#/components/schemas/Expiry" }
                password: { type: string, maxLength: 1024 }
                maxDownloads: { type: integer, minimum: 1, maximum: 1000000 }
                groupToken: { type: string }
                contentEncryption:
                  type: string
                  enum: [none, e2ee-v1]
                  description: "Для e2ee-v1 ключ шифрования добавляется клиентом в fragment shareUrl после символа #."
                originalSize: { type: integer, minimum: 1, description: Размер исходного файла для E2EE. }
      responses:
        "200": { $ref: "#/components/responses/Upload" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /upload-sessions:
    post:
      tags: [Uploads]
      operationId: createUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSessionCreateRequest" }
      responses:
        "201": { $ref: "#/components/responses/UploadSession" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /upload-sessions/{id}:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      tags: [Uploads]
      operationId: getUploadSession
      responses:
        "200": { $ref: "#/components/responses/UploadSessionStatus" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Uploads]
      operationId: cancelUploadSession
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /upload-sessions/{id}/parts/{index}:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - name: index
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
      - name: X-Chunk-SHA256
        in: header
        required: true
        schema: { type: string, pattern: "^[a-f0-9]{64}$" }
    put:
      tags: [Uploads]
      operationId: uploadPart
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Part" }
        "422": { $ref: "#/components/responses/Error" }
  /upload-sessions/{id}/complete:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    post:
      tags: [Uploads]
      operationId: completeUploadSession
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checksum: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
      responses:
        "200": { $ref: "#/components/responses/UploadCompletion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /transfers:
    get:
      tags: [Transfers]
      operationId: listTransfers
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, expired, revoked, password, e2ee] } }
        - { name: kind, in: query, schema: { type: string, enum: [file, group] } }
        - { name: sort, in: query, schema: { type: string, enum: [created, size, downloads], default: created } }
      responses:
        "200":
          $ref: "#/components/responses/TransferList"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /transfers/{token}:
    parameters:
      - { $ref: "#/components/parameters/Token" }
    get:
      tags: [Transfers]
      operationId: getTransfer
      responses:
        "200": { $ref: "#/components/responses/TransferDetails" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Transfers]
      operationId: updateTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Transfers]
      operationId: deleteTransfer
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "502": { $ref: "#/components/responses/Error" }
  /transfers/{token}/revoke:
    parameters:
      - { $ref: "#/components/parameters/Token" }
    post:
      tags: [Transfers]
      operationId: revokeTransfer
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /transfers/{token}/restore:
    parameters:
      - { $ref: "#/components/parameters/Token" }
    post:
      tags: [Transfers]
      operationId: restoreTransfer
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /stats:
    get:
      tags: [Account]
      operationId: getStats
      responses:
        "200":
          $ref: "#/components/responses/Stats"
  /notifications:
    get:
      tags: [Settings]
      operationId: getNotifications
      responses:
        "200": { $ref: "#/components/responses/Notifications" }
    patch:
      tags: [Settings]
      operationId: updateNotifications
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emailEnabled: { type: boolean }
                downloadNotifications: { type: boolean }
                summaryNotifications: { type: boolean }
                expiryWarningDays: { type: integer, minimum: 0, maximum: 30 }
      responses:
        "200": { $ref: "#/components/responses/Notifications" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  parameters:
    SessionId: { name: id, in: path, required: true, schema: { type: string } }
    Token: { name: token, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Expiry: { type: string, enum: [1h, 24h, 7d, 30d, never], default: never }
    GroupCreateRequest:
      type: object
      properties:
        expiry: { $ref: "#/components/schemas/Expiry" }
        password: { type: string, maxLength: 1024 }
        maxDownloads: { type: integer, minimum: 1, maximum: 1000000 }
    UploadSessionCreateRequest:
      type: object
      required: [fileName, totalSize]
      properties:
        fileName: { type: string, maxLength: 255 }
        mimeType: { type: string, maxLength: 255 }
        totalSize: { type: integer, minimum: 1 }
        originalSize: { type: integer, minimum: 1, description: Размер исходного файла для E2EE. }
        checksum: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        expiry: { $ref: "#/components/schemas/Expiry" }
        password: { type: string, maxLength: 1024 }
        maxDownloads: { type: integer, minimum: 1, maximum: 1000000 }
        groupToken: { type: string }
        contentEncryption:
          type: string
          enum: [none, e2ee-v1]
          description: "Для e2ee-v1 ключ шифрования добавляется клиентом в fragment shareUrl после символа #."
    TransferUpdateRequest:
      type: object
      properties:
        expiry: { type: string, enum: [keep, 1h, 24h, 7d, 30d, never] }
        expiresAt: { type: [string, "null"], format: date-time }
        password: { type: [string, "null"], maxLength: 1024 }
        maxDownloads: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
    Transfer:
      type: object
      required: [kind, token, name, size, fileCount, shareUrl]
      properties:
        kind: { type: string, enum: [file, group] }
        token: { type: string }
        name: { type: string }
        size: { type: integer }
        fileCount: { type: integer }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadCount: { type: integer }
        maxDownloads: { type: [integer, "null"] }
        hasPassword: { type: boolean }
        storageEncrypted: { type: boolean }
        contentEncryption: { type: string, enum: [none, e2ee-v1] }
        createdAt: { type: string }
        revoked: { type: boolean }
        expired: { type: boolean }
        shareUrl: { type: string, format: uri }
        canRecreateLink: { type: boolean }
    File:
      type: object
      required: [token, name, size, mimeType, expiresAt, maxDownloads, hasPassword, revoked, storageEncrypted, contentEncryption, createdAt]
      properties:
        token: { type: string }
        name: { type: string }
        size: { type: integer }
        mimeType: { type: string }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadCount: { type: integer }
        maxDownloads: { type: [integer, "null"] }
        hasPassword: { type: boolean }
        revoked: { type: boolean }
        storageEncrypted: { type: boolean }
        contentEncryption: { type: string, enum: [none, e2ee-v1] }
        createdAt: { type: string, format: date-time }
    GroupResponse:
      type: object
      required: [token, shareUrl, expiresAt, maxDownloads, hasPassword]
      properties:
        token: { type: string }
        shareUrl: { type: string, format: uri }
        expiresAt: { type: [string, "null"], format: date-time }
        maxDownloads: { type: [integer, "null"] }
        hasPassword: { type: boolean }
    UploadResponse:
      type: object
      required: [file]
      properties:
        file: { $ref: "#/components/schemas/File" }
    UploadSessionCreateResponse:
      type: object
      required: [sessionId, status, totalSize, chunkSize, totalChunks, uploadedParts]
      properties:
        sessionId: { type: string }
        status: { type: string }
        totalSize: { type: integer }
        chunkSize: { type: integer }
        totalChunks: { type: integer }
        uploadedParts: { type: array, items: { type: integer } }
    UploadedPart:
      type: object
      required: [index, size, checksum]
      properties:
        index: { type: integer }
        size: { type: integer }
        checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
    UploadSessionStatusResponse:
      type: object
      required: [sessionId, status, totalSize, chunkSize, totalChunks, uploadedParts, result]
      properties:
        sessionId: { type: string }
        status: { type: string }
        totalSize: { type: integer }
        chunkSize: { type: integer }
        totalChunks: { type: integer }
        uploadedParts: { type: array, items: { $ref: "#/components/schemas/UploadedPart" } }
        result: { oneOf: [{ $ref: "#/components/schemas/File" }, { type: "null" }] }
    PartResponse:
      type: object
      required: [success, index]
      properties:
        success: { type: boolean }
        index: { type: integer }
        checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
        alreadyUploaded: { type: boolean }
    UploadCompletionResponse:
      type: object
      required: [success, file]
      properties:
        success: { type: boolean }
        file: { $ref: "#/components/schemas/File" }
        alreadyCompleted: { type: boolean }
    TransferDetailsResponse:
      type: object
      required: [kind, token, shareUrl, canRecreateLink, group, file, files]
      properties:
        kind: { type: string, enum: [file, group] }
        token: { type: string }
        shareUrl: { type: string, format: uri }
        canRecreateLink: { type: boolean }
        group: { type: [object, "null"], additionalProperties: true }
        file: { oneOf: [{ $ref: "#/components/schemas/File" }, { type: "null" }] }
        files: { type: array, items: { $ref: "#/components/schemas/File" } }
    TransferListResponse:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    StatsResponse:
      type: object
      required: [transfers, downloads, recentDownloads]
      properties:
        transfers: { type: integer }
        downloads: { type: integer }
        recentDownloads:
          type: array
          items:
            type: object
            required: [fileName, token, outcome, createdAt, isGroupDownload]
            properties:
              fileName: { type: string }
              token: { type: string }
              outcome: { type: string }
              createdAt: { type: string, format: date-time }
              isGroupDownload: { type: boolean }
    NotificationsResponse:
      type: object
      required: [emailEnabled, downloadNotifications, summaryNotifications, expiryWarningDays]
      properties:
        emailEnabled: { type: boolean }
        downloadNotifications: { type: boolean }
        summaryNotifications: { type: boolean }
        expiryWarningDays: { type: integer }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Success:
      description: Successful operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessResponse" }
    Me:
      description: Current user
      content:
        application/json:
          schema:
            type: object
            required: [id, email, createdAt]
            properties:
              id: { type: integer }
              email: { type: string, format: email }
              createdAt: { type: string }
    Group:
      description: Created group
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GroupResponse" }
    Upload:
      description: Uploaded file
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UploadResponse" }
    UploadSession:
      description: Created upload session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UploadSessionCreateResponse" }
    UploadSessionStatus:
      description: Upload session status
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UploadSessionStatusResponse" }
    Part:
      description: Uploaded part
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PartResponse" }
    UploadCompletion:
      description: Result of completing an upload session
      content:
        application/json:
          schema:
            type: object
            required: [success, file]
            properties:
              success: { type: boolean }
              file: { $ref: "#/components/schemas/File" }
              alreadyCompleted: { type: boolean }
    TransferDetails:
      description: Transfer details
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TransferDetailsResponse" }
    TransferList:
      description: Paginated transfers
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TransferListResponse" }
    Stats:
      description: User statistics
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StatsResponse" }
    Notifications:
      description: Notification settings
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NotificationsResponse" }
