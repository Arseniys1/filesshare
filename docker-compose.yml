name: filesshare

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      UPLOAD_TEMP_DIR: /var/filesshare/uploads
      TRUST_PROXY: "1"
    volumes:
      - app_data:/app/data
      - upload_tmp:/var/filesshare/uploads
      - telegram_data:/var/lib/telegram-bot-api:ro
    expose:
      - "3000"
    depends_on:
      - telegram-bot-api
    networks:
      - private

  telegram-bot-api:
    build:
      context: .
      dockerfile: docker/telegram-bot-api.Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    command:
      - --api-id=${TELEGRAM_API_ID}
      - --api-hash=${TELEGRAM_API_HASH}
      - --local
      - --http-ip-address=0.0.0.0
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
    volumes:
      - telegram_data:/var/lib/telegram-bot-api
      - upload_tmp:/var/filesshare/uploads:ro
    expose:
      - "8081"
    networks:
      - private

  cleanup:
    build:
      context: .
      dockerfile: docker/cleanup/Dockerfile
    restart: unless-stopped
    environment:
      CLEANUP_KEY: ${CLEANUP_KEY}
    depends_on:
      - app
    networks:
      - private

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - private

volumes:
  app_data:
  upload_tmp:
  telegram_data:
  certbot_www:

networks:
  private:
